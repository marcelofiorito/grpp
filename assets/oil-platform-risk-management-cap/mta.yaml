_schema-version: "3.1"
ID: oil-platform-risk-management-cap
version: 1.0.0
description: Gerenciamento de Riscos — Plataformas de Petróleo

modules:
  - name: oil-platform-risk-management-cap-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 512M
      disk-quota: 1024M
    build-parameters:
      builder: npm
      build-result: .
      ignore:
        - node_modules/
        - .git/
        - test/
        - app/risk-ui/src/
        - app/risk-ui/node_modules/
        - gen/
    properties:
      NODE_ENV: production
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
